AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ADOT Demo - Single template for ECS + ALB + SQS + Lambda + DynamoDB + S3 + ADOT Collector (private ECS, internal collector ALB)

Parameters:
  AppEnv:
    Type: String
    Default: "staging"
    AllowedValues: [staging, production]
Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 60

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: adot-demo-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.0.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [1, !GetAZs '']

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NatEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs '']

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [1, !GetAZs '']

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  UsersBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "adot-demo-users-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled

  UserQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: adot-demo-user-queue
      VisibilityTimeout: 60

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: adot-demo-cluster

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: AdotDemoTaskInline
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: ["logs:*","xray:*"]
                Resource: "*"
              - Effect: Allow
                Action: ["sqs:*","dynamodb:*","s3:*","ecr:*"]
                Resource: "*"

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/adot-demo-app
      RetentionInDays: 30

  CollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/adot-demo-collector
      RetentionInDays: 30

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ADOT Demo SG
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 4317
          ToPort: 4317
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 4318
          ToPort: 4318
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 13133
          ToPort: 13133
          CidrIp: 0.0.0.0/0

  AppTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      Family: adot-demo-app
      Cpu: 256
      Memory: 512
      NetworkMode: awsvpc
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/adot-demo-app:latest"
          PortMappings:
            - ContainerPort: 80
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: TABLE_NAME
              Value: !Ref UsersTable
            - Name: QUEUE_URL
              Value: !Ref UserQueue
            - Name: OTEL_EXPORTER_OTLP_ENDPOINT
              Value: "http://otel-service.internal:4318"
            - Name: APP_ENV
              Value: !Ref AppEnv

  CollectorTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      Family: adot-demo-collector
      Cpu: 256
      Memory: 512
      NetworkMode: awsvpc
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: otel-collector
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/adot-demo-collector:latest"
          Essential: true
          Command: ["--config=/etc/otel/otel-config.yaml"]
          PortMappings:
            - ContainerPort: 4317
              Protocol: tcp
            - ContainerPort: 4318
              Protocol: tcp
            - ContainerPort: 13133
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CollectorLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: otel

  # Public ALB for the app
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: adot-demo-alb
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      SecurityGroups: [!Ref ServiceSecurityGroup]
      Scheme: internet-facing
      Type: application

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: adot-demo-tg
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  AppListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

  # Internal ALB for the collector
  AdotALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: adot-internal-alb
      Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      SecurityGroups: [!Ref ServiceSecurityGroup]
      Scheme: internal
      Type: application

  AdotTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: adot-internal-tg
      Port: 4318
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /
      HealthCheckPort: 13133
      HealthCheckProtocol: HTTP


  AdotListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AdotALB
      Port: 4318
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AdotTargetGroup

  AdotInternalHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: "internal."
      VPCs:
        - VPCId: !Ref VPC
          VPCRegion: !Ref AWS::Region

  AdotAliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref AdotInternalHostedZone
      Name: "otel-service.internal"
      Type: A
      AliasTarget:
        DNSName: !GetAtt AdotALB.DNSName
        HostedZoneId: !GetAtt AdotALB.CanonicalHostedZoneID

  AppService:
    Type: AWS::ECS::Service
    DependsOn: AppListener
    Properties:
      ServiceName: adot-demo-app
      Cluster: !Ref ECSCluster
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref ServiceSecurityGroup]
          Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      TaskDefinition: !Ref AppTaskDefinition
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 80
          TargetGroupArn: !Ref AppTargetGroup

  CollectorService:
    Type: AWS::ECS::Service
    DependsOn: AdotListener
    Properties:
      ServiceName: adot-demo-collector
      Cluster: !Ref ECSCluster
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref ServiceSecurityGroup]
          Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      TaskDefinition: !Ref CollectorTaskDefinition
      LoadBalancers:
        - ContainerName: otel-collector
          ContainerPort: 4318
          TargetGroupArn: !Ref AdotTargetGroup

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AdotDemoLambdaInline
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # - Effect: Allow
              #   Action:
              #     - dynamodb:PutItem
              #   Resource: !GetAtt UsersTable.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${UsersBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt UserQueue.Arn
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  ConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lambda-adot-demo-consumer
      Runtime: nodejs20.x
      Timeout: 60
      Role: !GetAtt LambdaRole.Arn
      Tracing: Active
      Layers:
        - !Sub "arn:aws:lambda:ap-southeast-1:615299751070:layer:AWSOpenTelemetryDistroJs:11"
      Environment:
        Variables:
          TABLE_NAME: !Ref UsersTable
          S3_BUCKET: !Ref UsersBucket
          AWS_LAMBDA_EXEC_WRAPPER: /opt/otel-instrument
          OTEL_TRACES_SAMPLER: traceidratio
          OTEL_TRACES_SAMPLER_ARG: 1.0
      Handler: index.handler
      CodeUri: functions/consumer
      Events:
        QueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt UserQueue.Arn
            BatchSize: 10
            # FunctionResponseTypes:
            #   - ReportBatchItemFailures

  ListUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lambda-adot-demo-list-users
      Runtime: nodejs20.x
      Timeout: 30
      Role: !GetAtt ListUsersLambdaRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref UsersTable
      Handler: index.handler
      CodeUri: functions/list-users

  ListUsersLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ListUsersPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                Resource: !GetAtt UsersTable.Arn

Outputs:
  ALBEndpoint:
    Description: Public ALB URL
    Value: !Join ['', ['http://', !GetAtt ALB.DNSName]]
  ECSCluster:
    Description: ECS Cluster Name
    Value: !Ref ECSCluster
  QueueUrl:
    Description: User SQS Queue URL
    Value: !Ref UserQueue
  UsersBucketName:
    Description: S3 bucket name for user CSVs
    Value: !Ref UsersBucket
  UsersTableName:
    Description: DynamoDB Users table
    Value: !Ref UsersTable
  ListUsersFunctionName:
    Description: List Users Lambda Function Name
    Value: !Ref ListUsersFunction


